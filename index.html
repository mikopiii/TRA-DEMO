
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Runaway Bride</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #1B1B1B;
    color: #eee;
    font-family: 'Special Elite', cursive;
    min-height: 100vh;
    overflow: hidden;
}

/* TOP BUTTONS */
.top-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    z-index: 10;
    opacity: 1;
    transition: opacity .6s ease;
}

.top-controls.fade-out {
    opacity: 0;
    pointer-events: none;
}

.control-box {
    width: 100px;
    height: 38px;
    border: 2px solid #ff0000;
    background: #1B1B1B;
    color: #ff0000;
    font: 12px 'Special Elite', cursive;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* EXIT BUTTON */
.exit-control {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 20;
    display: none;
}

.exit-control.show {
    display: flex;
}

/* DROPDOWN MENU */
.dropdown-menu {
    display: none;
    flex-direction: column;
    width: 100px;
    margin-top: 5px;
    border: 2px solid #ff0000;
    background: #1B1B1B;
}

.dropdown-menu.show {
    display: flex;
}

.dropdown-button {
    width: 100%;
    height: 35px;
    border: none;
    background: transparent;
    color: #ff0000;
    font: 10px 'Special Elite', cursive;
    letter-spacing: 1px;
    cursor: pointer;
    transition: none;
}

/* MAIN TITLE */
.center-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 1;
    visibility: visible;
    transition: opacity .6s ease, visibility .6s ease;
    cursor: pointer;
}

.center-content.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.main-title {
    font-size: 55px;
    font-weight: 500;
    letter-spacing: 8px;
    color: #ff0000;
    white-space: nowrap;
    animation: brokenBulb 5s infinite;
}

@keyframes brokenBulb {
    0%,18%,20%,22%,25%,54%,56%,100% {
        opacity: 1;
        text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 45px #800000;
    }
    19%,21%,55% {
        opacity: .15;
        text-shadow: none;
    }
    23%,24% {
        opacity: .6;
        text-shadow: 0 0 5px #ff0000;
    }
    70% {
        opacity: .85;
        text-shadow: 0 0 15px #ff0000;
    }
}

.start-text {
    margin-top: 18px;
    font-size: 15px;
    letter-spacing: 3px;
    color: #a9d4ff;
    animation: fadeText 2.5s ease-in-out infinite;
}

@keyframes fadeText {
    0%,100% { opacity: .15; }
    50% { opacity: 1; }
}

/* GENERAL SCREENS */
.screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 110px 20px 50px;
    text-align: center;
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .6s ease, visibility .6s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

/* CHAPTER SECTION */
.section-title {
    font-size: 38px;
    font-weight: 500;
    letter-spacing: 7px;
    color: #dceaff;
    text-shadow: 0 0 15px #ff0000;
    margin-bottom: 55px;
}

.chapter-list {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 1100px;
}

.chapter-button {
    flex: 1;
    max-width: 190px;
    min-width: 0;
    height: 220px;
    background: #1B1B1B;
    border: 2px solid #ff0000;
    color: #a9d4ff;
    font: 17px 'Special Elite', cursive;
    letter-spacing: 3px;
    cursor: pointer;
    transition: none;
    box-shadow: none;
}

/* BACK BUTTON */
.back-button {
    margin-top: 55px;
    width: 170px;
    height: 50px;
    background: #1B1B1B;
    border: 1px solid #ff0000;
    color: #a9d4ff;
    font: 14px 'Special Elite', cursive;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .3s;
}

/* CHAPTER DESCRIPTION */
.chapter-description {
    color: #a9d4ff;
    font-size: 15px;
    letter-spacing: 2px;
    margin-top: 15px;
}

/* ABOUT SECTION */
.about-credit {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: 2px;
}

.about-mikopi { color: #a9d4ff; }
.about-nicapi { color: #ffb6d9; }

/* GAME DIALOGUE */
#gameScreen {
    justify-content: flex-end;
    padding: 30px;
    cursor: pointer;
}

.dialogue-box {
    width: 100%;
    max-width: 900px;
    min-height: 150px;
    border: 1px solid #800000;
    background: rgba(10, 0, 0, .92);
    box-shadow: 0 0 15px rgba(255, 0, 0, .2);
    padding: 25px 30px;
    text-align: left;
    margin-bottom: 20px;
    opacity: 0;
    transition: opacity .6s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.dialogue-box.dialogue-visible { opacity: 1; }

.dialogue-content {
    flex: 1;
    min-width: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.character-name {
    color: #ff3333;
    font-size: 17px;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

.dialogue-text {
    color: #eee;
    font-size: 16px;
    letter-spacing: 1px;
    line-height: 1.8;
    min-height: 55px;
}

.continue-text {
    color: #999;
    font-size: 11px;
    letter-spacing: 3px;
    text-align: left;
    animation: fadeText 2s infinite;
    margin-top: 12px;
}

.mc-portrait {
    width: 110px;
    height: 120px;
    object-fit: cover;
    flex-shrink: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s ease;
}

.mc-portrait.visible {
    opacity: 1;
    visibility: visible;
}

/* CHAPTER INTRO TRANSITION */
#chapterIntro {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff0000;
    font-size: 35px;
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
}

#chapterIntro.show { opacity: 1; }

/* NEW GAME / CONTINUE OPTIONS */
.start-options {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin: 25px auto 0;
    width: 230px;
}

.start-options.show { display: flex; }

.start-option-button {
    width: 100%;
    padding: 13px;
    border: 1px solid #ff0000;
    background: #1B1B1B;
    color: #a9d4ff;
    font: 13px 'Special Elite', cursive;
    letter-spacing: 2px;
    cursor: pointer;
}

/* SAVES SCREEN */
#savesScreen {
    overflow-y: auto;
    justify-content: flex-start;
    padding-top: 70px;
}

.save-slots {
    width: 100%;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.save-slot {
    border: 1px solid #ff0000;
    background: #1B1B1B;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    text-align: left;
}

.save-slot-info {
    flex: 1;
    min-width: 0;
}

.save-slot-title {
    color: #ff0000;
    font-size: 16px;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.save-slot-details {
    color: #999;
    font-size: 11px;
    line-height: 1.8;
    letter-spacing: 1px;
}

.save-slot-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.save-action {
    min-width: 95px;
    padding: 9px 12px;
    border: 1px solid #ff0000;
    background: #000;
    color: #ff0000;
    font: 11px 'Special Elite', cursive;
    letter-spacing: 1px;
    cursor: pointer;
}

.save-empty { color: #ff0000; }

.save-mode-description {
    color: #a9d4ff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: -35px;
    margin-bottom: 30px;
}

/* MOBILE */
@media (max-width: 750px) {
    .chapter-list { flex-wrap: wrap; }

    .chapter-button {
        flex: 0 0 40%;
        height: 140px;
    }

    .main-title {
        font-size: 30px;
        letter-spacing: 3px;
        white-space: normal;
    }

    .section-title { font-size: 27px; }

    .dialogue-box {
        padding: 20px;
        gap: 12px;
    }

    .dialogue-text { font-size: 14px; }

    .mc-portrait {
        width: 75px;
        height: 85px;
    }

    #gameScreen { padding-bottom: 100px; }

    .save-slot { align-items: flex-start; }

    .save-slot-actions { flex-shrink: 0; }

    .about-credit {
        font-size: 21px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<!-- MENU BUTTON -->
<div class="top-controls" id="topControls">
    <button class="control-box" id="menuButton">Menu</button>
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-button" id="settingsOption">Settings</button>
        <button class="dropdown-button" id="chaptersOption">Chapters</button>
        <button class="dropdown-button" id="savesOption">Saves</button>
        <button class="dropdown-button" id="aboutOption">About</button>
    </div>
</div>

<!-- EXIT BUTTON -->
<button class="control-box exit-control" id="exitButton">Leave?</button>

<!-- MAIN TITLE -->
<div class="center-content" id="startScreen">
    <h1 class="main-title">The Runaway Bride</h1>
    <p class="start-text">Click Here To Start</p>
    <div class="start-options" id="startOptions">
        <button class="start-option-button" id="newGameButton">New Run</button>
        <button class="start-option-button" id="continueButton">Continue?</button>
    </div>
</div>

<!-- CHAPTER SELECTION -->
<section class="screen" id="chapterScreen">
    <h2 class="section-title">Diary</h2>
    <div class="chapter-list">
        <button class="chapter-button" data-chapter="1">Chapter 1</button>
        <button class="chapter-button" data-chapter="2">Chapter 2</button>
        <button class="chapter-button" data-chapter="3">Chapter 3</button>
        <button class="chapter-button" data-chapter="4">Chapter 4</button>
        <button class="chapter-button" data-chapter="5">Chapter 5</button>
    </div>
    <button class="back-button" id="chapterBack">Back</button>
</section>

<!-- INDIVIDUAL CHAPTER -->
<section class="screen" id="individualChapter">
    <h2 class="section-title" id="chapterTitle">Chapter 1</h2>
    <p class="chapter-description">Locked</p>
    <button class="back-button" id="returnChapters">Back to chapters?</button>
</section>

<!-- ABOUT SCREEN -->
<section class="screen" id="aboutScreen">
    <h2 class="about-credit">
        Created by <span class="about-mikopi">Mikopi</span> &amp;
        <span class="about-nicapi">Nicapi</span>
    </h2>
    <button class="back-button" id="aboutBack" style="background: #000;">Back</button>
</section>

<!-- SAVES SCREEN -->
<section class="screen" id="savesScreen">
    <h2 class="section-title">Saves</h2>
    <p class="save-mode-description" id="saveModeDescription">
        Select a save slot to continue.
    </p>
    <div class="save-slots" id="saveSlots"></div>
    <button class="back-button" id="savesBack">Back</button>
</section>

<!-- GAME DIALOGUE -->
<section class="screen" id="gameScreen">
    <div id="chapterIntro">Chapter 1</div>
    <div class="dialogue-box" id="dialogueBox">
        <div class="dialogue-content">
            <h3 class="character-name" id="characterName">UNKNOWN</h3>
            <p class="dialogue-text" id="dialogueText"></p>
            <p class="continue-text">Click to continue</p>
        </div>
        <img src="images/mainchar.jpg" alt="Main Character" class="mc-portrait" id="mcPortrait">
    </div>
</section>

<script>
(function () {
    const characterNameEl = document.getElementById("characterName");
    const mcPortraitEl = document.getElementById("mcPortrait");

    if (!characterNameEl || !mcPortraitEl) return;

    window.mcPortraitUnlocked = false;

    function syncPortraitVisibility() {
        const speaker = (characterNameEl.textContent || "").trim().toLowerCase();
        mcPortraitEl.classList.toggle(
            "visible",
            window.mcPortraitUnlocked === true && speaker === "you"
        );
    }

    window.updateCharacterPortrait = function (speakerName) {
        if (typeof speakerName === "string") {
            characterNameEl.textContent = speakerName;
        }
        syncPortraitVisibility();
    };

    new MutationObserver(syncPortraitVisibility).observe(characterNameEl, {
        characterData: true,
        childList: true,
        subtree: true
    });

    syncPortraitVisibility();
})();
</script>

<script src="script.js"></script>
</body>
</html>
