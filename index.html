
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Runaway Bride</title>

<!-- SPECIAL ELITE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #eee;
    font-family: 'Special Elite', cursive;
    min-height: 100vh;
    overflow: hidden;
}

/* TOP BUTTONS */
.top-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    z-index: 10;
    opacity: 1;
    transition: opacity .6s ease;
}

.top-controls.fade-out {
    opacity: 0;
    pointer-events: none;
}

.control-box {
    width: 100px;
    height: 38px;
    border: 2px solid #247bff;
    background: #030916;
    color: #ff0000;
    font-family: 'Special Elite', cursive;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 8px rgba(36,123,255,.45),
                inset 0 0 12px rgba(36,123,255,.12);
    transition: none;
}

/* EXIT BUTTON */
.exit-control {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 20;
    display: none;
}

.exit-control.show {
    display: flex;
}

/* DROPDOWN MENU */
.dropdown-menu {
    display: none;
    flex-direction: column;
    width: 100px;
    margin-top: 5px;
    border: 2px solid #247bff;
    background: #030916;
    box-shadow: 0 0 8px rgba(36,123,255,.45),
                inset 0 0 12px rgba(36,123,255,.12);
}

.dropdown-menu.show {
    display: flex;
}

.dropdown-button {
    width: 100%;
    height: 35px;
    border: none;
    border-bottom: 1px solid rgba(36,123,255,.4);
    background: transparent;
    color: #ff0000;
    font-family: 'Special Elite', cursive;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: none;
}

.dropdown-button:last-child {
    border-bottom: none;
}

/* MAIN TITLE */
.center-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 1;
    visibility: visible;
    transition: opacity .6s ease, visibility .6s ease;
    cursor: pointer;
}

.center-content.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.main-title {
    font-size: 55px;
    font-weight: 500;
    letter-spacing: 8px;
    color: #ff0000;
    white-space: nowrap;
    animation: brokenBulb 5s infinite;
}

@keyframes brokenBulb {
    0%,18%,20%,22%,25%,54%,56%,100% {
        opacity: 1;
        text-shadow: 0 0 10px #ff0000,
                     0 0 25px #ff0000,
                     0 0 45px #800000;
    }

    19%,21%,55% {
        opacity: .15;
        text-shadow: none;
    }

    23%,24% {
        opacity: .6;
        text-shadow: 0 0 5px #ff0000;
    }

    70% {
        opacity: .85;
        text-shadow: 0 0 15px #ff0000;
    }
}

.start-text {
    margin-top: 18px;
    font-size: 15px;
    letter-spacing: 3px;
    color: #a9d4ff;
    animation: fadeText 2.5s ease-in-out infinite;
}

@keyframes fadeText {
    0%,100% { opacity: .15; }
    50% { opacity: 1; }
}

/* GENERAL SCREENS */
.screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 110px 20px 50px;
    text-align: center;
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .6s ease, visibility .6s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

/* CHAPTER SECTION */
.section-title {
    font-size: 38px;
    font-weight: 500;
    letter-spacing: 7px;
    color: #dceaff;
    text-shadow: 0 0 15px #247bff;
    margin-bottom: 55px;
}

/* CHAPTER BOXES */
.chapter-list {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 1100px;
}

.chapter-button {
    flex: 1;
    max-width: 190px;
    min-width: 0;
    height: 220px;
    background: #000;
    border: 2px solid #247bff;
    color: #a9d4ff;
    font-family: 'Special Elite', cursive;
    font-size: 17px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: none;
    box-shadow: none;
}

/* BACK BUTTON */
.back-button {
    margin-top: 55px;
    width: 170px;
    height: 50px;
    background: #030916;
    border: 1px solid #247bff;
    color: #a9d4ff;
    font-family: 'Special Elite', cursive;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .3s;
}

/* CHAPTER DESCRIPTION */
.chapter-description {
    color: #a9d4ff;
    font-size: 15px;
    letter-spacing: 2px;
    margin-top: 15px;
}

/* GAME DIALOGUE */
#gameScreen {
    justify-content: flex-end;
    padding: 30px;
    cursor: pointer;
}

.dialogue-box {
    width: 100%;
    max-width: 900px;
    min-height: 150px;
    border: 1px solid #800000;
    background: rgba(10, 0, 0, .92);
    box-shadow: 0 0 15px rgba(255, 0, 0, .2);
    padding: 25px 30px;
    text-align: left;
    margin-bottom: 20px;
    opacity: 0;
    transition: opacity .6s ease;
}

.dialogue-box.dialogue-visible {
    opacity: 1;
}

.character-name {
    color: #ff3333;
    font-size: 17px;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

.dialogue-text {
    color: #eee;
    font-size: 16px;
    letter-spacing: 1px;
    line-height: 1.8;
    min-height: 55px;
}

.continue-text {
    color: #999;
    font-size: 11px;
    letter-spacing: 3px;
    text-align: right;
    animation: fadeText 2s infinite;
    margin-top: 12px;
}

/* CHAPTER INTRO TRANSITION */
#chapterIntro {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff0000;
    font-size: 35px;
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
}

#chapterIntro.show {
    opacity: 1;
}

/* MOBILE */
@media (max-width: 750px) {
    .chapter-list {
        flex-wrap: wrap;
    }

    .chapter-button {
        flex: 0 0 40%;
        height: 140px;
    }

    .main-title {
        font-size: 30px;
        letter-spacing: 3px;
        white-space: normal;
    }

    .section-title {
        font-size: 27px;
    }

    .dialogue-box {
        padding: 20px;
    }

    .dialogue-text {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- MENU BUTTON -->
<div class="top-controls" id="topControls">
    <button class="control-box" id="menuButton">MENU</button>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-button" id="settingsOption">SETTINGS</button>
        <button class="dropdown-button" id="chaptersOption">CHAPTERS</button>
        <button class="dropdown-button" id="aboutOption">ABOUT</button>
    </div>
</div>

<!-- EXIT BUTTON -->
<button class="control-box exit-control" id="exitButton">
    EXIT
</button>

<!-- MAIN TITLE -->
<div class="center-content" id="startScreen">
    <h1 class="main-title">THE RUNAWAY BRIDE</h1>
    <p class="start-text">Tap here to start</p>
</div>

<!-- CHAPTER SELECTION -->
<section class="screen" id="chapterScreen">

    <h2 class="section-title">Journey</h2>

    <div class="chapter-list">
        <button class="chapter-button" data-chapter="1">CHAPTER 1</button>
        <button class="chapter-button" data-chapter="2">CHAPTER 2</button>
        <button class="chapter-button" data-chapter="3">CHAPTER 3</button>
        <button class="chapter-button" data-chapter="4">CHAPTER 4</button>
        <button class="chapter-button" data-chapter="5">CHAPTER 5</button>
    </div>

    <button class="back-button" id="chapterBack">BACK</button>

</section>

<!-- INDIVIDUAL CHAPTER -->
<section class="screen" id="individualChapter">

    <h2 class="section-title" id="chapterTitle">CHAPTER 1</h2>

    <p class="chapter-description">
        The story of The Runaway Bride begins here...
    </p>

    <button class="back-button" id="returnChapters">
        BACK TO CHAPTERS
    </button>

</section>

<!-- GAME DIALOGUE -->
<section class="screen" id="gameScreen">

    <div id="chapterIntro">Chapter 1</div>

    <div class="dialogue-box" id="dialogueBox">

        <h3 class="character-name" id="characterName">
            UNKNOWN
        </h3>

        <p class="dialogue-text" id="dialogueText"></p>

        <p class="continue-text">
            CLICK TO CONTINUE
        </p>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
